steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '.'
    id: 'build-image'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_COMMIT_SHA}'
    id: 'push-sha-image'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
    id: 'push-latest-image'

  # 3. Deploy new revision to Cloud Run (Economical cost-controlled configuration)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--service-account'
      - 'monarch-gemini-run@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--min-instances'
      - '1'
      - '--no-cpu-throttling'
      - '--max-instances'
      - '1'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--set-env-vars'
      - 'PROJECT_ID=${PROJECT_ID},BQ_DATASET_ID=${_DATASET_ID},REGION=${_REGION},ENABLE_CHAT_PULL_WORKER=true,CHAT_SUBSCRIPTION=monarch-chat-sub,VERTEX_MEMORY_BANK_NAME=${_MEMORY_BANK},DEFAULT_USER_EMAIL=${_DEFAULT_USER_EMAIL}'
      - '--set-secrets'
      - 'MONARCH_EMAIL=monarch-email:latest,MONARCH_PASSWORD=monarch-password:latest,MONARCH_MFA_SECRET=monarch-mfa-secret:latest,GEMINI_WRAPPER_KEY=gemini-wrapper-key:latest,ALERT_WEBHOOK_URL=alert-webhook-url:latest,GEMINI_API_KEY=gemini-api-key:latest'
      - '--no-allow-unauthenticated'
      - '--ingress'
      - 'internal'
    id: 'deploy-cloud-run'

  # 4. Deploy Cloud Run Jobs for batch execution
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying Cloud Run Jobs..."
        gcloud run jobs deploy monarch-sync-job \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_COMMIT_SHA}" \
          --region="${_REGION}" \
          --service-account="monarch-gemini-run@${PROJECT_ID}.iam.gserviceaccount.com" \
          --set-env-vars="PROJECT_ID=${PROJECT_ID},BQ_DATASET_ID=${_DATASET_ID},REGION=${_REGION}" \
          --set-secrets="MONARCH_EMAIL=monarch-email:latest,MONARCH_PASSWORD=monarch-password:latest,MONARCH_MFA_SECRET=monarch-mfa-secret:latest" \
          --command="python" \
          --args="-m,app.job,sync" \
          --max-retries=1 \
          --task-timeout=600s

        gcloud run jobs deploy monarch-alerts-job \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_COMMIT_SHA}" \
          --region="${_REGION}" \
          --service-account="monarch-gemini-run@${PROJECT_ID}.iam.gserviceaccount.com" \
          --set-env-vars="PROJECT_ID=${PROJECT_ID},BQ_DATASET_ID=${_DATASET_ID},REGION=${_REGION}" \
          --set-secrets="MONARCH_EMAIL=monarch-email:latest,MONARCH_PASSWORD=monarch-password:latest,MONARCH_MFA_SECRET=monarch-mfa-secret:latest" \
          --command="python" \
          --args="-m,app.job,alerts" \
          --max-retries=1 \
          --task-timeout=300s
    id: 'deploy-cloud-run-jobs'

  # 5. Synchronize BigQuery schema and analytical views
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Applying BigQuery schema and analytical views..."
        bq query --use_legacy_sql=false --project_id=${PROJECT_ID} < schema.sql
    id: 'apply-bigquery-schema'

substitutions:
  _REGION: 'us-central1'
  _REPO: 'monarch-repo'
  _SERVICE: 'monarch-gemini-wrapper'
  _DATASET_ID: 'family_finance'
  _COMMIT_SHA: 'latest'
  _MEMORY_BANK: ''
  _DEFAULT_USER_EMAIL: 'user@example.com'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${_COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'
